name: Release

# Pushing a tag like v0.2.0 publishes both images to GitHub's container registry, for amd64
# and arm64: ghcr.io/<owner>/climatectl and ghcr.io/<owner>/climatectl-grafana, each tagged
# 0.2.0, 0.2 and latest. deploy/compose.yaml uses them.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv run --locked ruff check
      - run: uv run --locked pytest

  images:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Build and push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use
          publish() {  # name, context
            docker buildx build --platform linux/amd64,linux/arm64 --push \
              --build-arg "VERSION=$version" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.version=$version" \
              -t "$registry/$1:$version" -t "$registry/$1:${version%.*}" -t "$registry/$1:latest" \
              "$2"
          }
          publish climatectl .
          publish climatectl-grafana deploy/grafana
